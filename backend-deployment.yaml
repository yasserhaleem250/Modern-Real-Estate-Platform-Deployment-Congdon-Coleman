apiVersion: apps/v1
kind: Deployment
metadata:
  name: congdon-backend
  labels:
    app: congdon-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: congdon-backend
  template:
    metadata:
      labels:
        app: congdon-backend
    spec:
      containers:
      - name: backend
        image: ${DOCKER_REGISTRY:-registry.example.com}/congdon-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
