stages:
  - build
  - push
  - deploy

variables:
  DOCKER_REGISTRY: ${DOCKER_REGISTRY:-registry.example.com}
  BACKEND_IMAGE: $DOCKER_REGISTRY/congdon-backend
  FRONTEND_IMAGE: $DOCKER_REGISTRY/congdon-frontend

build-backend:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker info
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA -f backend/Dockerfile backend
    - docker tag $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA $BACKEND_IMAGE:latest

build-frontend:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker build -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA -f frontend/Dockerfile frontend
    - docker tag $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA $FRONTEND_IMAGE:latest

push-images:
  stage: push
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $DOCKER_REGISTRY
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest

deploy-to-k8s:
  stage: deploy
  image: bitnami/kubectl:1.27
  script:
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig
    - kubectl --kubeconfig=kubeconfig apply -f deploy/k8s/
  only:
    - main
