apiVersion: apps/v1
kind: Deployment
metadata:
  name: congdon-frontend
  labels:
    app: congdon-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: congdon-frontend
  template:
    metadata:
      labels:
        app: congdon-frontend
    spec:
      containers:
      - name: frontend
        image: ${DOCKER_REGISTRY:-registry.example.com}/congdon-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
